[alembic]
# Path to migration scripts.  Do not change this unless you move the
# `alembic` directory elsewhere.
script_location = alembic

# Logging configuration used by Alembic.  These values are read by
# Python’s logging module.  The default values are sufficient for
# development.
sqlalchemy.url = sqlite+aiosqlite:///./data/oshpoint.db

# Set the timezone to UTC so that timestamps in migrations match
# timestamps produced by SQLAlchemy models.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
